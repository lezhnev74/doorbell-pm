name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - uses: golangci/golangci-lint-action@v7
        with:
          args: --build-tags e2e ./...
      - run: make test
      - run: make e2e

  qa:
    name: CRAP and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cover.out
